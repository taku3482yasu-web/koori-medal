<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>こおりくんの大冒険～氷の城と大きな竜～</title>
<meta name="description" content="こおりくんたちが 氷の 城の てっぺんで ジャックポットを ねらう、プッシャー＋JP 抽選の メダルゲーム">
<meta name="theme-color" content="#081428">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14' shape-rendering='crispEdges'%3E%3Crect width='14' height='12' fill='%231b3566'/%3E%3Crect x='1' y='1' width='12' height='10' fill='%23c6f0ff'/%3E%3Crect x='4' y='4' width='1' height='2' fill='%230e1626'/%3E%3Crect x='9' y='4' width='1' height='2' fill='%230e1626'/%3E%3Crect x='6' y='7' width='2' height='1' fill='%230e1626'/%3E%3Crect x='2' y='12' width='3' height='2' fill='%231b3566'/%3E%3Crect x='9' y='12' width='3' height='2' fill='%231b3566'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
    <header class="bar">
        <div class="logo"><b>こおりくんの大冒険</b><small>～氷の城と大きな竜～</small></div>
        <div class="stat"><span>メダル</span><b id="medals">0</b></div>
        <div class="stat jp"><span>こおりJP</span><b id="jp">0</b></div>
        <div class="stat gauge"><span>ボスゲージ</span><i class="bar-g"><i id="gauge"></i></i></div>
        <div class="tools"><button id="snd-btn" title="音">🔊</button><button id="help-btn" title="遊び方">❓</button></div>
    </header>
    <div class="stage-wrap">
        <canvas id="stage" width="1000" height="620"></canvas>
        <div id="snd-panel" class="panel-pop" hidden><label><input type="checkbox" id="snd-mute"> ミュート</label><label>音量 <input type="range" id="snd-vol" min="0" max="100"></label></div>
    </div>
    <p class="hint">プッシャーの 上を タップ (クリック) で その 位置に メダルを 入れる。長押しで 連射。スペースキーでも 入れられる。<span class="rotate">スマホは 横向きが おすすめ。</span></p>
</main>
<div id="modal" class="modal" hidden><div class="modal-box" id="modal-box"></div></div>

<script src="js/vendor/matter.min.js"></script>
<script src="js/config.js"></script>
<script src="js/game.js"></script>
<script src="js/pusher.js"></script>
<script src="js/art-legacy.js"></script>
<script src="js/art-boss.js"></script>
<script src="js/art-new.js"></script>
<script src="js/pixel-hd.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>

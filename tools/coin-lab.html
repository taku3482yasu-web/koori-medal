<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>メダルの 物理 (2.5D) の 試作</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../js/coin25d.js"></script>
<script src="../js/art-legacy.js"></script>
<script src="../js/art-boss.js"></script>
<script src="../js/art-new.js"></script>
<script src="../js/pixel-hd.js"></script>
<script src="../js/art.js"></script>
<script>
// 画面イメージ案 (見るだけ)。席に すわった 目線で 見た 大型メダルゲーム。
// 物理は 今の 真上 2D の まま、描く ときだけ 台形 (遠近) に うつす つもりの 絵。
const W = 540, H = 960, DPR = 2;
const SCENE = new URLSearchParams(location.search).get('scene') || 'normal'; // normal / crane
const cv = document.getElementById('c');
cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const g = cv.getContext('2d'); g.scale(DPR, DPR);
const FONT = '"Noto Sans CJK JP", sans-serif';
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function txt(s, x, y, size, color, opt = {}) {
    g.font = `${opt.bold ? 900 : 700} ${size}px ${FONT}`; g.textAlign = opt.align || 'center'; g.textBaseline = 'middle';
    if (opt.stroke) { g.lineWidth = opt.sw || 4; g.strokeStyle = opt.stroke; g.lineJoin = 'round'; g.strokeText(s, x, y); }
    if (opt.glow) { g.shadowColor = opt.glow; g.shadowBlur = opt.blur || 12; }
    g.fillStyle = color; g.fillText(s, x, y); g.shadowBlur = 0;
}
function led(x, y, r, c, on) { g.fillStyle = on ? c : 'rgba(255,255,255,0.08)'; if (on) { g.shadowColor = c; g.shadowBlur = 8; } g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.shadowBlur = 0; }

// ---------- 遠近 (プッシャー台) ----------
const CX = 270, YB = 486, YF = 892, WF = 700;
const sc = t => 0.42 + 0.58 * t;                       // 奥 → 手前の 大きさ (ひくい 目線で 強めの 遠近)
const py = t => YB + (YF - YB) * (t * 1.7) / (1 + 0.7 * t);
const px = (u, t) => CX + (u - 0.5) * WF * sc(t);
function quad(u0, u1, t0, t1, lift = 0) { g.beginPath(); g.moveTo(px(u0, t0), py(t0) - lift); g.lineTo(px(u1, t0), py(t0) - lift); g.lineTo(px(u1, t1), py(t1) - lift); g.lineTo(px(u0, t1), py(t1) - lift); g.closePath(); }

// メダル (遠近で つぶれた 円・ふち・刻印・厚み)
function medal(x, y, r, squash, gold, tilt = 0) {
    g.save(); g.translate(x, y); g.rotate(tilt);
    const ry = r * squash, th = Math.max(1.5, r * 0.28 * (1 - squash) + 1.5);
    const dark = gold ? '#8a5a10' : '#56606e', mid = gold ? '#e0a820' : '#aab4c2', hi = gold ? '#fff0a0' : '#ffffff';
    // 厚み
    g.fillStyle = dark; g.beginPath(); g.ellipse(0, th, r, ry, 0, 0, 7); g.fill(); g.fillRect(-r, 0, r * 2, th);
    // 面
    const gr = g.createLinearGradient(-r, -ry, r, ry); gr.addColorStop(0, hi); gr.addColorStop(0.45, mid); gr.addColorStop(1, dark);
    g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, r, ry, 0, 0, 7); g.fill();
    // ふちの 段
    g.strokeStyle = gold ? 'rgba(120,70,0,0.7)' : 'rgba(60,70,85,0.7)'; g.lineWidth = Math.max(0.8, r * 0.1);
    g.beginPath(); g.ellipse(0, 0, r * 0.74, ry * 0.74, 0, 0, 7); g.stroke();
    // 刻印 (雪の 結晶)
    if (r > 5) {
        g.strokeStyle = gold ? 'rgba(255,250,210,0.85)' : 'rgba(255,255,255,0.8)'; g.lineWidth = Math.max(0.7, r * 0.08);
        g.beginPath(); for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; g.moveTo(-Math.cos(a) * r * 0.48, -Math.sin(a) * ry * 0.48); g.lineTo(Math.cos(a) * r * 0.48, Math.sin(a) * ry * 0.48); } g.stroke();
    }
    // つや
    g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = Math.max(0.8, r * 0.12);
    g.beginPath(); g.ellipse(0, 0, r * 0.9, ry * 0.9, 0, Math.PI * 1.05, Math.PI * 1.55); g.stroke();
    g.restore();
}


// ---------- たて画面 ----------
function back() {
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0a1838'); gr.addColorStop(1, '#03060e');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // 城の 中の 氷の かべ
    g.fillStyle = 'rgba(143,220,255,0.07)';
    for (let i = 0; i < 9; i++) { const x = i * 64 - 10, hh = 120 + (i * 53) % 90; g.fillRect(x, 170 - hh, 40, hh + 260); }
}
// 上の じょうたい
function status() {
    g.fillStyle = 'rgba(0,0,0,0.65)'; g.fillRect(0, 0, W, 40);
    g.fillStyle = '#100a00'; rr(8, 6, 170, 28, 6); g.fill(); g.strokeStyle = '#ffd75e'; g.lineWidth = 1.5; rr(8, 6, 170, 28, 6); g.stroke();
    txt('こおりJP', 46, 20, 10, '#ffd75e', { bold: 1 }); txt('1,284 枚', 128, 20, 15, '#ffd75e', { bold: 1, glow: '#ffb000' });
    txt('ボスゲージ', 228, 20, 10, '#ff8a9a', { bold: 1 });
    g.fillStyle = '#2a0a12'; rr(266, 13, 200, 14, 7); g.fill();
    const bg = g.createLinearGradient(266, 0, 466, 0); bg.addColorStop(0, '#ff3a5a'); bg.addColorStop(1, '#ffd75e');
    g.fillStyle = bg; rr(266, 13, 138, 14, 7); g.fill();
    txt('69%', 435, 20, 10, '#ffffff', { bold: 1 });
    g.fillStyle = '#1a2a4a'; rr(480, 7, 52, 26, 6); g.fill(); txt('≡', 506, 20, 16, '#bfe8ff', { bold: 1 });
}
// JP ルーレット (いちばん 上)
function roulette() {
    const cx = 270, cy = 112, rx = 150, ry = 44, th = 16;
    const pockets = ['JP', 30, 50, 'A', 30, 40, 100, 30, 50, 'A', 30, 40, 60, 30, 50, 'A', 30, 40, 80, 30, 50, 30, 40, 30];
    g.fillStyle = 'rgba(143,220,255,0.08)'; g.beginPath(); g.ellipse(cx, cy - 6, rx + 14, 66, 0, Math.PI, 0); g.fill();
    g.strokeStyle = 'rgba(200,240,255,0.45)'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(cx, cy - 6, rx + 14, 66, 0, Math.PI, 0); g.stroke();
    g.fillStyle = '#7a8aa8'; g.beginPath(); g.ellipse(cx, cy + th, rx, ry, 0, 0, Math.PI); g.lineTo(cx - rx, cy); g.ellipse(cx, cy, rx, ry, 0, Math.PI, 0, true); g.closePath(); g.fill();
    for (let i = 0; i < 18; i++) { const a = Math.PI * (i + 0.5) / 18; led(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry + th / 2, 2.4, i % 2 ? '#ffd75e' : '#ff5ab0', true); }
    const off = -Math.PI / 2 - 0.35;
    pockets.forEach((p, i) => {
        const a0 = off + i * Math.PI * 2 / 24, a1 = a0 + Math.PI * 2 / 24;
        g.fillStyle = p === 'JP' ? '#ffd75e' : p === 'A' ? '#5ad890' : i % 2 ? '#1a4a8a' : '#2a6ab8';
        g.beginPath(); g.moveTo(cx, cy); for (let k = 0; k <= 6; k++) { const a = a0 + (a1 - a0) * k / 6; g.lineTo(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry); } g.closePath(); g.fill();
        const am = (a0 + a1) / 2;
        if (p !== 'A') txt(String(p), cx + Math.cos(am) * rx * 0.8, cy + Math.sin(am) * ry * 0.8, p === 'JP' ? 12 : 9, p === 'JP' ? '#7a3a00' : '#ffffff', { bold: 1 });
    });
    g.strokeStyle = '#d8e8ff'; g.lineWidth = 2; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, 7); g.stroke();
    g.fillStyle = '#e8f8ff'; g.beginPath(); g.ellipse(cx, cy - 4, 28, 12, 0, 0, 7); g.fill();
    Art.draw(g, 'koori', cx, cy + 4, { height: 28 });
    const ba = off + 1.3 * Math.PI * 2 / 24, bx = cx + Math.cos(ba) * rx * 0.92, by = cy + Math.sin(ba) * ry * 0.92 - 6;
    const b2 = g.createRadialGradient(bx - 3, by - 3, 1, bx, by, 9); b2.addColorStop(0, '#fff'); b2.addColorStop(1, '#2a8ae0');
    g.fillStyle = b2; g.beginPath(); g.arc(bx, by, 8, 0, 7); g.fill();
    txt('JPルーレット', cx, 52, 11, '#bfe8ff', { bold: 1, stroke: '#0a1428', sw: 3 });
}
// 氷の 塔 (左の 柱) と ボールリフト (右の 柱)
function pillars() {
    // 左: 氷の 塔
    const cx = 42, y0 = 60, y1 = 470;
    const gr = g.createLinearGradient(cx - 30, 0, cx + 30, 0); gr.addColorStop(0, '#5ab0e8'); gr.addColorStop(0.5, '#e8faff'); gr.addColorStop(1, '#3a88c8');
    g.fillStyle = gr; g.beginPath(); g.moveTo(cx - 18, y0 + 20); g.lineTo(cx + 18, y0 + 20); g.lineTo(cx + 30, y1); g.lineTo(cx - 30, y1); g.closePath(); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(cx - 24, y0 + 22); g.lineTo(cx, y0 - 6); g.lineTo(cx + 24, y0 + 22); g.fill();
    txt('JP', cx, y0 + 12, 10, '#ffd75e', { bold: 1, stroke: '#a07010', sw: 3 });
    [[1, 340, true], [2, 250, true], [3, 160, false]].forEach(([n, y, on]) => {
        const hw = 18 + (y - y0) / (y1 - y0) * 12 + 5;
        g.fillStyle = on ? '#ffd75e' : '#2a4a7a'; g.beginPath(); g.ellipse(cx, y, hw, 5, 0, 0, 7); g.fill();
        txt(`${n}段`, cx, y + 14, 9, on ? '#ffd75e' : '#8aa0c0', { bold: 1, stroke: '#0a1428', sw: 3 });
    });
    const bg = g.createRadialGradient(cx - 3, 236, 1, cx, 240, 8); bg.addColorStop(0, '#fff'); bg.addColorStop(1, '#2a8ae0');
    g.fillStyle = bg; g.beginPath(); g.arc(cx, 240, 7, 0, 7); g.fill();
    Art.draw(g, 'onioni', cx + 6, 200, { height: 28 });
    // 右: 金の ボールリフト (はしご)
    const rx = 498;
    g.strokeStyle = '#e8b830'; g.lineWidth = 4; g.beginPath(); g.moveTo(rx - 14, 70); g.lineTo(rx - 14, 470); g.moveTo(rx + 14, 70); g.lineTo(rx + 14, 470); g.stroke();
    g.lineWidth = 2; for (let y = 80; y < 470; y += 16) { g.beginPath(); g.moveTo(rx - 14, y); g.lineTo(rx + 14, y); g.stroke(); }
    for (let i = 0; i < 12; i++) led(rx + 22, 90 + i * 32, 2.2, i % 2 ? '#ffd75e' : '#6ae8ff', true);
    const b3 = g.createRadialGradient(rx - 3, 198, 1, rx, 202, 9); b3.addColorStop(0, '#fff'); b3.addColorStop(1, '#2a8ae0');
    g.fillStyle = b3; g.beginPath(); g.arc(rx, 202, 8, 0, 7); g.fill();
    Art.draw(g, 'okagappa', rx, 262, { height: 36 });
    txt('氷の塔', cx, 378, 10, '#bfe8ff', { bold: 1, stroke: '#0a1428', sw: 3 });
}
// 液晶 (まんなか)
function monitor() {
    const x = 92, y = 176, w = 356, h = 210;
    g.fillStyle = '#05070c'; rr(x - 10, y - 10, w + 20, h + 20, 16); g.fill();
    const fr = g.createLinearGradient(0, y - 10, 0, y + h + 10); fr.addColorStop(0, '#ffe890'); fr.addColorStop(1, '#a07010');
    g.strokeStyle = fr; g.lineWidth = 4; rr(x - 10, y - 10, w + 20, h + 20, 16); g.stroke();
    g.save(); rr(x, y, w, h, 8); g.clip();
    const sky = g.createLinearGradient(0, y, 0, y + h); sky.addColorStop(0, '#1c4a9a'); sky.addColorStop(1, '#8fd0ff');
    g.fillStyle = sky; g.fillRect(x, y, w, h);
    g.fillStyle = 'rgba(230,250,255,0.8)';
    for (const [bx, bw, bh] of [[x + 10, 34, 90], [x + 50, 44, 130], [x + 260, 40, 110], [x + 304, 40, 80]]) { g.fillRect(bx, y + h - bh, bw, bh); g.beginPath(); g.moveTo(bx - 3, y + h - bh); g.lineTo(bx + bw / 2, y + h - bh - 24); g.lineTo(bx + bw + 3, y + h - bh); g.fill(); }
    g.fillStyle = '#e8f8ff'; g.fillRect(x, y + h - 22, w, 22);
    g.fillStyle = 'rgba(255,255,255,0.8)'; for (let i = 0; i < 30; i++) g.fillRect(x + rnd() * w, y + rnd() * h, 2, 2);
    for (let i = 0; i < 3; i++) {
        const rx = x + 28 + i * 104, ry = y + 22, rw = 92, rh = 92;
        g.fillStyle = 'rgba(255,255,255,0.94)'; rr(rx, ry, rw, rh, 10); g.fill();
        g.strokeStyle = '#3a6ad0'; g.lineWidth = 2.5; rr(rx, ry, rw, rh, 10); g.stroke();
        if (i < 2) Art.draw(g, 'koori', rx + rw / 2, ry + rh - 12, { height: 66 });
        else { g.fillStyle = 'rgba(58,106,208,0.25)'; g.fillRect(rx, ry, rw, rh); txt('?', rx + rw / 2, ry + rh / 2, 50, '#3a6ad0', { bold: 1 }); }
    }
    if (SCENE === 'crane') {
        g.fillStyle = 'rgba(10,20,50,0.85)'; g.fillRect(x, y, w, h);
        Art.draw(g, 'kongouki', x + 70, y + 200, { height: 100 });
        g.strokeStyle = '#ff3a3a'; g.lineWidth = 8; g.beginPath(); g.moveTo(x + 28, y + 110); g.lineTo(x + 112, y + 194); g.moveTo(x + 112, y + 110); g.lineTo(x + 28, y + 194); g.stroke();
        txt('げきは！', x + w / 2, y + 40, 40, '#ffd75e', { bold: 1, stroke: '#c02030', sw: 7 });
        txt('金剛鬼を たおした！', x + w / 2, y + 84, 16, '#ffffff', { bold: 1, stroke: '#0a1428', sw: 4 });
        txt('ビックボスメダルタワー', x + 262, y + 140, 14, '#ffd75e', { bold: 1, stroke: '#0a1428', sw: 4 });
        txt('とうちゃく！', x + 262, y + 168, 22, '#ffd75e', { bold: 1, stroke: '#0a1428', sw: 5 });
        g.restore(); return;
    }
    txt('リーチ！', x + w / 2, y + 140, 38, '#ffd75e', { bold: 1, stroke: '#c02030', sw: 7 });
    Art.draw(g, 'okagappa', x + 300, y + h - 8, { height: 60 });
    ['#3a7ae0', '#6ae8ff', '#ffd75e'].forEach((c, i) => led(x + 30 + i * 20, y + h - 14, 6, c, true));
    txt('保留', x + 100, y + h - 14, 10, '#1a2a4a', { align: 'left', bold: 1 });
    g.restore();
}
// うしろの かべ (チャッカー) と 左右の 金の かべ
function backWall() {
    const wy = py(0);
    g.fillStyle = '#0e2448'; g.beginPath(); g.moveTo(px(0, 0) - 10, wy - 64); g.lineTo(px(1, 0) + 10, wy - 64); g.lineTo(px(1, 0), wy); g.lineTo(px(0, 0), wy); g.closePath(); g.fill();
    g.strokeStyle = '#8fdcff'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(px(0, 0) - 10, wy - 64); g.lineTo(px(1, 0) + 10, wy - 64); g.stroke();
    [['L', 0.15, '#8fdcff'], ['CENTER', 0.5, '#ffd75e'], ['R', 0.85, '#8fdcff']].forEach(([n, u, c]) => {
        const x = px(u, 0), big = n === 'CENTER';
        const w = big ? 70 : 44;
        g.fillStyle = '#02060e'; rr(x - w / 2, wy - 48, w, 24, 10); g.fill(); g.strokeStyle = c; g.lineWidth = 2.5; rr(x - w / 2, wy - 48, w, 24, 10); g.stroke();
        if (big) { g.shadowColor = c; g.shadowBlur = 14; g.stroke(); g.shadowBlur = 0; }
        txt(n, x, wy - 36, big ? 11 : 10, c, { bold: 1 });
        g.fillStyle = c; g.beginPath(); g.moveTo(x - 6, wy - 18); g.lineTo(x + 6, wy - 18); g.lineTo(x, wy - 10); g.fill();
    });
}
function sideWalls() {
    for (const s of [-1, 1]) {
        const u = s < 0 ? 0 : 1, xe = s < 0 ? 0 : W;
        const gr = g.createLinearGradient(s < 0 ? 0 : W, 0, px(u, 0), 0); gr.addColorStop(0, '#6a4a10'); gr.addColorStop(0.6, '#e8c050'); gr.addColorStop(1, '#fff0a8');
        g.fillStyle = gr; g.beginPath(); g.moveTo(px(u, 0), py(0) - 64); g.lineTo(px(u, 0), py(0)); g.lineTo(px(u, 1), py(1)); g.lineTo(xe, py(1)); g.lineTo(xe, py(0) - 90); g.closePath(); g.fill();
        // ねらいの やじるし (L / R レーン)
        const ax = s < 0 ? 26 : W - 26;
        g.fillStyle = 'rgba(255,255,255,0.85)'; g.beginPath(); g.moveTo(ax, 560); g.lineTo(ax - 10, 578); g.lineTo(ax + 10, 578); g.fill();
        g.beginPath(); g.moveTo(ax, 700); g.lineTo(ax - 10, 682); g.lineTo(ax + 10, 682); g.fill();
        g.fillRect(ax - 2, 578, 4, 104);
        g.fillStyle = '#c02030'; g.beginPath(); g.arc(ax, 630, 12, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke();
        for (let i = 0; i < 10; i++) { const t = i / 9; led(px(u, t) - s * 8, py(t) - 6, 2.4, ['#ff5ab0', '#ffd75e', '#6ae8ff'][i % 3], i % 2 === 0); }
    }
}
// プッシャー台

// ================= メダルの 物理 (2.5D) を 遠近で 描く =================
const Q = new URLSearchParams(location.search);
const sim = Coin25D.create({ seed: Number(Q.get('seed') || 5) });
const SP = sim.P, ZK = 0.95;
const tOf = y => Math.max(0, (y + 10) / (SP.LE + 10));
const sOf = t => WF * sc(t) / SP.FW;                 // 1 単位 → 画面の px
function P3(x, y, z) { const t = tOf(y); return [px(x / SP.FW, t), py(t) - z * sOf(t) * ZK]; }
function poly(pts, fill) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fillStyle = fill; g.fill(); }
const top3 = (y0, y1, z) => [P3(0, y0, z), P3(SP.FW, y0, z), P3(SP.FW, y1, z), P3(0, y1, z)];
const face3 = (y, z0, z1) => [P3(0, y, z1), P3(SP.FW, y, z1), P3(SP.FW, y, z0), P3(0, y, z0)];

// 立体の メダル (厚み・ふちの ぎざぎざ・刻印・かたむき)
function coin3d(c) {
    const t = tOf(c.y), s = sOf(t);
    const [x, y] = P3(c.x, c.y, c.z);
    const r = SP.R * s, th = SP.T * s * ZK + 0.6;
    let k = 0.30 + 0.24 * t + c.ty * 0.9, rot = c.tx * 0.75;
    if (!c.on) { k = 0.3 + Math.abs(Math.sin(c.spin)) * 0.6; rot += Math.sin(c.spin * 0.7) * 0.4; }
    k = Math.max(0.1, Math.min(0.95, k));
    const ry = r * k, gold = c.kind === 'gold';
    const C0 = gold ? ['#fff3b0', '#e8b020', '#8a5a08', '#5a3a04'] : ['#ffffff', '#c4ccd8', '#6a7484', '#3a4250'];
    g.save(); g.translate(x, y); g.rotate(rot);
    // 側面 (厚み)
    const sg = g.createLinearGradient(-r, 0, r, 0); sg.addColorStop(0, C0[3]); sg.addColorStop(0.35, C0[1]); sg.addColorStop(0.6, C0[2]); sg.addColorStop(1, C0[3]);
    g.fillStyle = sg; g.beginPath(); g.ellipse(0, 0, r, ry, 0, 0, Math.PI); g.lineTo(-r, -th); g.ellipse(0, -th, r, ry, 0, Math.PI, 0, true); g.closePath(); g.fill();
    if (r > 6) {   // ふちの ぎざぎざ
        g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 0.8; g.beginPath();
        for (let i = -6; i <= 6; i++) { const xx = r * Math.sin(i * 0.24), yy = ry * Math.sqrt(Math.max(0, 1 - (xx / r) ** 2)); g.moveTo(xx, yy - th); g.lineTo(xx, yy); }
        g.stroke();
    }
    // 面
    const fg = g.createLinearGradient(-r * 0.7, -th - ry, r * 0.7, -th + ry); fg.addColorStop(0, C0[0]); fg.addColorStop(0.5, C0[1]); fg.addColorStop(1, C0[2]);
    g.fillStyle = fg; g.beginPath(); g.ellipse(0, -th, r, ry, 0, 0, 7); g.fill();
    // ふちの 段 (内がわ)
    g.strokeStyle = gold ? 'rgba(110,60,0,0.55)' : 'rgba(50,58,72,0.5)'; g.lineWidth = Math.max(0.8, r * 0.09);
    g.beginPath(); g.ellipse(0, -th, r * 0.78, ry * 0.78, 0, 0, 7); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = Math.max(0.6, r * 0.05);
    g.beginPath(); g.ellipse(0, -th + ry * 0.04, r * 0.84, ry * 0.84, 0, Math.PI * 0.1, Math.PI * 0.9); g.stroke();
    // 刻印 (雪の 結晶)
    if (r > 7) {
        g.strokeStyle = gold ? 'rgba(255,248,200,0.9)' : 'rgba(255,255,255,0.85)'; g.lineWidth = Math.max(0.7, r * 0.07);
        g.beginPath(); for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; g.moveTo(-Math.cos(a) * r * 0.5, -th - Math.sin(a) * ry * 0.5); g.lineTo(Math.cos(a) * r * 0.5, -th + Math.sin(a) * ry * 0.5); } g.stroke();
    }
    // つや
    g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = Math.max(1, r * 0.11);
    g.beginPath(); g.ellipse(0, -th, r * 0.94, ry * 0.94, 0, Math.PI * 1.1, Math.PI * 1.5); g.stroke();
    g.restore();
}

function simField() {
    const pu = sim.pushers.upper, pl = sim.pushers.lower, hU = SP.pushU.h, hL = SP.pushL.h;
    poly(top3(SP.UE, SP.LE, 0), '#1e5aa0');                                       // 下段の 台
    const fr = top3(SP.LE - 4, SP.LE, 0); poly(fr, 'rgba(191,240,255,0.5)');       // 手前の はし
    poly(top3(0, SP.UE, SP.HU), '#2a6ab0');                                        // 上段の 台
    poly(top3(0, pu.y, SP.HU + hU), '#d8eeff'); poly(face3(pu.y, SP.HU, SP.HU + hU), '#7ab0e0');   // 上段の プッシャー
    poly(face3(SP.UE, 0, SP.HU), '#123a70');                                       // 上段の 前の かべ
    poly(top3(SP.UE, pl.y, hL), '#c0e0fa'); poly(face3(pl.y, 0, hL), '#6aa0d8');   // 下段の プッシャー
    const list = sim.coins.slice().sort((a, b) => (a.y + a.z * 1.2) - (b.y + b.z * 1.2));
    for (const c of list) coin3d(c);
}

let credit = Number(Q.get('medals') || 499), last = 0, frame = 0;
const auto = Q.get('auto') !== null;
function scene() {
    seed = 7;
    back(); status(); pillars(); roulette(); monitor(); backWall(); sideWalls(); simField(); bottom();
}

function bottom() {
    g.fillStyle = '#0a0f1c'; g.fillRect(0, 892, W, H - 892);
    const fr = g.createLinearGradient(0, 892, 0, 900); fr.addColorStop(0, '#e8c050'); fr.addColorStop(1, '#6a4a10'); g.fillStyle = fr; g.fillRect(0, 892, W, 6);
    for (const [x, l] of [[50, 'L'], [490, 'R']]) {
        const gr = g.createRadialGradient(x - 8, 920, 4, x, 928, 34); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#8aa0c0');
        g.fillStyle = gr; g.beginPath(); g.arc(x, 928, 30, 0, 7); g.fill(); g.strokeStyle = '#2a3a5a'; g.lineWidth = 3; g.stroke();
        txt(l, x, 929, 26, '#c02030', { bold: 1 });
    }
    g.fillStyle = '#000'; rr(120, 908, 300, 40, 8); g.fill(); g.strokeStyle = '#e8c050'; g.lineWidth = 2; rr(120, 908, 300, 40, 8); g.stroke();
    txt('メダル', 170, 928, 14, '#ffd75e', { bold: 1 });
    g.fillStyle = '#1a1a1a'; rr(226, 914, 184, 28, 5); g.fill();
    txt(String(credit).padStart(5, '0'), 318, 928, 22, '#ffffff', { bold: 1 });
}

// 入れる: 台の 上を タップ
cv.addEventListener('pointerdown', e => {
    const b = cv.getBoundingClientRect(), mx = (e.clientX - b.left) * W / b.width;
    const t = tOf(sim.pushers.upper.y + 20), x = ((mx - CX) / (WF * sc(t)) + 0.5) * SP.FW;
    if (credit > 0) { credit--; sim.insert(x); }
});
sim.fill(Number(Q.get('up') || 170), Number(Q.get('low') || 520));
const pre = Number(Q.get('pre') || 0);
for (let i = 0; i < pre; i++) { if (auto && i % 12 === 0) sim.insert(SP.FW / 2 + (Math.sin(i) * 120)); sim.step(); }
credit += sim.take().pay;
if (Q.get('tower')) { for (const c of sim.coins.slice()) if (!c.level && Math.hypot(c.x - SP.FW / 2, c.y - 300) < SP.R * 2.2) c.gone = true; sim.coins.splice(0, sim.coins.length, ...sim.coins.filter(c => !c.gone)); sim.tower(SP.FW / 2, 300, 34); for (let i = 0; i < Number(Q.get('after') || 3); i++) sim.step(); }
function loop(ts) {
    const dt = Math.min(50, ts - (last || ts)); last = ts;
    if (auto && frame++ % 12 === 0 && credit > 0) { credit--; sim.insert(SP.FW / 2 + Math.sin(frame) * 120); }
    sim.step(dt || 16.7); credit += sim.take().pay;
    scene();
    requestAnimationFrame(loop);
}
scene();
if (Q.get('still') === null) requestAnimationFrame(loop);
document.title = 'ready';
</script>
</body>
